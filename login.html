<!DOCTYPE html>
<html>
    <head lang="id">
        <title>
            Login | Sunday
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="login-box">
            <div class="logo">&#127918;</div>
            <h1>Selamat Datang</h1>
            <p class="subjudul">Silahkan masuk ke akun anda</p>

            <form id="loginf">
                
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkkan Username">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan Password">

                <div class="ingat">
                    <input type="checkbox" id="ingat" name="ingat">
                    <label for="ingat">Ingat Saya</label>
                </div>

                <button type="submit">Login</button>
                <p id="pesan" class="pesan"></p>

            </form>
        </div>
    </body>
</html>
